name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    timeout-minutes: 10            # si la máquina va fatal, falla rápido en vez de colgarse
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esperar si macOS va saturado (capacidad de runners arm64)
        if: matrix.os == 'macos-latest'
        run: sleep 5
      - name: pytest (acciones + CLI)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -v
        env:
          APUNCLI_DB: ${{ runner.temp }}/apuncli-ci.db
