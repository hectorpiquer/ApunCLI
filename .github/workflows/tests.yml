name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest (acciones + CLI)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -v
        env:
          APUNCLI_DB: ${{ runner.temp }}/apuncli-ci.db
      - name: volcar log si falla (quitar tras el primer verde)
        if: failure()
        run: python -m pytest tests/ -v --tb=long
        env:
          APUNCLI_DB: ${{ runner.temp }}/apuncli-ci.db
