name: pruebas

# pytest en tres sistemas en cada push/PR.
# macOS: GitHub avisa de "capacity constraints" en los runners arm64 (a veces
# el job no llega a adquirirse y queda 'cancelled'). El job aviso-macos lo
# registra como AVISO en el summary en lugar de bloquear la check; los fallos
# REALES de ubuntu/windows sí la ponen en roja (su job exit-an). El rojo de
# macOS se quita re-disparando la run cuando GitHub tenga hueco (Re-run
# failed jobs).

on:
  push:                    # todos los pushes (ramas incluidas): más runs
  pull_request:

jobs:
  ubuntu:
    name: pruebas (ubuntu)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -v
        env:
          APUNCLI_DB: ${{ runner.temp }}/apuncli-ci.db

  windows:
    name: pruebas (windows)
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -v
        env:
          APUNCLI_DB: ${{ runner.temp }}/apuncli-ci.db

  macos:
    name: pruebas (macOS)
    timeout-minutes: 10
    # continue-on-error: el rojo de macOS lo decide el resumen (abajo), no el
    # runner caprichoso de GitHub. Si falla por 'capacity constraints', el
    # job macos-intenta lo vuelve a probar con huecos de cola.
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -v
        env:
          APUNCLI_DB: ${{ runner.temp }}/apuncli-ci.db

  macos-intenta:
    # Segundo asalto para macOS: si el primer intento falló, espera y reintenta
    # (GitHub libera runners arm64 a intervalos irregulares).
    name: macOS reintento
    needs: [macos]
    if: needs.macos.result != 'success'
    timeout-minutes: 25
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esperar hueco de cola (runners arm64 saturados)
        run: sleep 180
      - name: pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -v
        env:
          APUNCLI_DB: ${{ runner.temp }}/apuncli-ci.db

  resumen:
    name: resumen (ubuntu · windows obligatorios)
    needs: [ubuntu, windows, macos, macos-intenta]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ubuntu y windows no perdonan
        run: |
          if [ "${{ needs.ubuntu.result }}" != "success" ] || [ "${{ needs.windows.result }}" != "success" ]; then
            echo "::error::Fallo real: ubuntu=${{ needs.ubuntu.result }} · windows=${{ needs.windows.result }}"
            exit 1
          fi
          echo "ubuntu y windows: en verde."
      - name: Aviso de macOS (saturación de runners arm64)
        run: |
          resultado="${{ needs.macos.result }}"
          if [ "$resultado" != "success" ]; then
            # si el reintento pasó, cuenta como verde
            if [ "${{ needs.macos-intenta.result }}" = "success" ]; then
              echo "macOS: en verde (tras reintento por cola de runners)."
              exit 0
            fi
          fi
          case "$resultado" in
            success) echo "macOS: en verde." ;;
            failure)
              echo "::warning::macOS en rojo. Mira los logs: puede ser el código o la infraestructura de GitHub ('capacity constraints' / 'job was not acquired'). Re-dispara con 'Re-run failed jobs'." ;;
            cancelled)
              echo "::notice::macOS cancelado: el runner arm64 no estuvo disponible (aviso oficial de GitHub, no es un fallo del proyecto). Re-dispara con 'Re-run failed jobs' cuando haya hueco." ;;
            skipped)
              echo "::warning::macOS no llegó a ejecutarse (sin runner)." ;;
            *)
              echo "::warning::macOS: '${{ needs.macos.result }}'." ;;
          esac
